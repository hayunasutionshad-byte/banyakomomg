<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC PANEL PROXY — ELITE ACCESS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap');

  :root {
    --neon-cyan: #00f5ff;
    --neon-purple: #bf00ff;
    --neon-pink: #ff006e;
    --neon-gold: #ffd60a;
    --dark-bg: #020408;
    --dark-card: rgba(0,245,255,0.04);
    --glass: rgba(0,245,255,0.07);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark-bg);
    font-family: 'Rajdhani', sans-serif;
    color: #e0f7ff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── THREE.JS CANVAS ── */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* ── SCANLINES OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,245,255,0.015) 2px,
      rgba(0,245,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* ── VIGNETTE ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── MAIN WRAPPER ── */
  .wrapper {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 60px;
  }

  /* ── TOP NAV BAR ── */
  .nav {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid rgba(0,245,255,0.12);
    margin-bottom: 0;
  }

  .nav-logo {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    text-transform: uppercase;
    opacity: 0.7;
  }

  .nav-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #00ff88;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88, 0 0 20px #00ff88;
    animation: blink 1.4s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity: 0.3; }
  }

  /* ── HERO SECTION ── */
  .hero {
    width: 100%;
    max-width: 1100px;
    text-align: center;
    padding: 80px 0 60px;
  }

  .hero-eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--neon-purple);
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.3s forwards;
  }

  .hero-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(40px, 8vw, 90px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s forwards;
  }

  .title-main {
    display: block;
    background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 50%, var(--neon-purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(0,245,255,0.4));
    position: relative;
  }

  /* Glitch effect */
  .title-main::before,
  .title-main::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0; right: 0;
    background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 50%, var(--neon-purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .title-main::before {
    animation: glitch1 4s infinite;
    clip-path: polygon(0 20%, 100% 20%, 100% 35%, 0 35%);
    transform: translateX(-3px);
    opacity: 0.6;
    filter: drop-shadow(0 0 4px var(--neon-pink));
  }

  .title-main::after {
    animation: glitch2 4s infinite;
    clip-path: polygon(0 65%, 100% 65%, 100% 80%, 0 80%);
    transform: translateX(3px);
    opacity: 0.6;
    filter: drop-shadow(0 0 4px var(--neon-purple));
  }

  @keyframes glitch1 {
    0%,90%,100% { transform: translateX(0); clip-path: none; opacity: 0; }
    92% { transform: translateX(-4px); clip-path: polygon(0 20%, 100% 20%, 100% 35%, 0 35%); opacity: 0.7; }
    94% { transform: translateX(4px); opacity: 0.5; }
    96% { transform: translateX(0); opacity: 0; }
  }

  @keyframes glitch2 {
    0%,88%,100% { transform: translateX(0); clip-path: none; opacity: 0; }
    89% { transform: translateX(4px); clip-path: polygon(0 60%, 100% 60%, 100% 78%, 0 78%); opacity: 0.7; }
    91% { transform: translateX(-4px); opacity: 0.4; }
    93% { transform: translateX(0); opacity: 0; }
  }

  .title-sub {
    display: block;
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 3vw, 22px);
    font-weight: 400;
    letter-spacing: 8px;
    color: rgba(191,0,255,0.8);
    text-transform: uppercase;
    margin-top: 10px;
    text-shadow: 0 0 20px rgba(191,0,255,0.6);
  }

  .hero-desc {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: rgba(0,245,255,0.55);
    letter-spacing: 2px;
    margin-top: 28px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.9s forwards;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ── CTA BUTTON ── */
  .cta-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-top: 48px;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.1s forwards;
  }

  .btn-primary {
    position: relative;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    color: #000;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    padding: 16px 40px;
    border: none;
    cursor: pointer;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 30px rgba(0,245,255,0.5), 0 0 60px rgba(191,0,255,0.2);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-primary:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 0 50px rgba(0,245,255,0.7), 0 0 100px rgba(191,0,255,0.4);
  }

  .btn-secondary {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--neon-cyan);
    background: transparent;
    padding: 15px 36px;
    border: 1px solid rgba(0,245,255,0.4);
    cursor: pointer;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }

  .btn-secondary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,245,255,0.08), rgba(191,0,255,0.05));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-secondary:hover::before { opacity: 1; }
  .btn-secondary:hover {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0,245,255,0.3), inset 0 0 20px rgba(0,245,255,0.05);
    color: #fff;
  }

  /* ── DIVIDER ── */
  .section-divider {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 0 auto 60px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.3s forwards;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,245,255,0.3), transparent);
  }

  .divider-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0,245,255,0.4);
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── STATS ROW ── */
  .stats-row {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 2px;
    margin-bottom: 70px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.4s forwards;
  }

  .stat-card {
    background: var(--dark-card);
    border: 1px solid rgba(0,245,255,0.08);
    padding: 28px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .stat-card:hover { background: rgba(0,245,255,0.07); border-color: rgba(0,245,255,0.25); }
  .stat-card:hover::before { opacity: 1; }

  .stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 20px rgba(0,245,255,0.7);
    display: block;
    margin-bottom: 6px;
  }

  .stat-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 70px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.6s forwards;
  }

  .feature-card {
    background: var(--glass);
    border: 1px solid rgba(0,245,255,0.1);
    padding: 36px 32px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s ease;
    cursor: default;
  }

  .feature-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,245,255,0.04) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.35s;
  }

  .feature-card:hover {
    border-color: rgba(0,245,255,0.35);
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,245,255,0.08);
  }

  .feature-card:hover::after { opacity: 1; }

  /* corner accents */
  .feature-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 40px; height: 40px;
    border-top: 2px solid var(--neon-cyan);
    border-left: 2px solid var(--neon-cyan);
    opacity: 0.5;
    transition: opacity 0.3s, width 0.3s, height 0.3s;
  }

  .feature-card:hover::before { opacity: 1; width: 60px; height: 60px; }

  .card-icon {
    font-size: 32px;
    margin-bottom: 20px;
    display: block;
    filter: drop-shadow(0 0 10px rgba(0,245,255,0.6));
  }

  .card-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(191,0,255,0.5);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .card-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    line-height: 1.7;
    font-family: 'Share Tech Mono', monospace;
  }

  .card-tag {
    display: inline-block;
    margin-top: 18px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--neon-cyan);
    border: 1px solid rgba(0,245,255,0.3);
    padding: 4px 12px;
    text-transform: uppercase;
  }

  /* ── TELEGRAM SECTION ── */
  .tg-section {
    width: 100%;
    max-width: 1100px;
    margin-bottom: 70px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.8s forwards;
  }

  .tg-card {
    position: relative;
    background: linear-gradient(135deg, rgba(0,245,255,0.05) 0%, rgba(191,0,255,0.05) 100%);
    border: 1px solid rgba(0,245,255,0.2);
    padding: 50px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    overflow: hidden;
    flex-wrap: wrap;
  }

  .tg-card::before {
    content: '';
    position: absolute;
    inset: -1px;
    background: linear-gradient(135deg, var(--neon-cyan), transparent 40%, var(--neon-purple));
    z-index: -1;
    opacity: 0.15;
    border-radius: inherit;
  }

  /* Animated shimmer */
  .tg-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,245,255,0.04), transparent);
    animation: shimmer 4s linear infinite;
  }

  @keyframes shimmer {
    to { left: 200%; }
  }

  .tg-left { flex: 1; min-width: 220px; }

  .tg-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--neon-gold);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tg-badge::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--neon-gold);
    box-shadow: 0 0 6px var(--neon-gold);
  }

  .tg-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 4vw, 40px);
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 10px;
    text-shadow: 0 0 40px rgba(0,245,255,0.3);
  }

  .tg-handle {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(18px, 3vw, 28px);
    color: var(--neon-cyan);
    text-shadow: 0 0 30px rgba(0,245,255,0.8);
    display: block;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .tg-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .tg-btn {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    color: #000;
    background: var(--neon-cyan);
    padding: 18px 44px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.25s;
    box-shadow: 0 0 30px rgba(0,245,255,0.5), 0 0 60px rgba(0,245,255,0.2);
    white-space: nowrap;
    position: relative;
    z-index: 1;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }

  .tg-btn:hover {
    background: #fff;
    box-shadow: 0 0 60px rgba(0,245,255,0.9), 0 0 100px rgba(0,245,255,0.4);
    transform: translateY(-3px) scale(1.04);
  }

  .tg-icon {
    width: 22px; height: 22px;
    fill: #000;
  }

  /* ── TERMINAL BLOCK ── */
  .terminal {
    width: 100%;
    max-width: 1100px;
    margin-bottom: 70px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(0,245,255,0.15);
    padding: 0;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.8s ease 2.0s forwards;
  }

  .terminal-bar {
    background: rgba(0,245,255,0.07);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(0,245,255,0.1);
  }

  .t-dot { width: 10px; height: 10px; border-radius: 50%; }
  .t-red { background: #ff5f57; }
  .t-yellow { background: #febc2e; }
  .t-green { background: #28c840; }

  .terminal-title {
    margin-left: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(0,245,255,0.4);
    letter-spacing: 2px;
  }

  .terminal-body {
    padding: 28px 32px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    line-height: 2;
    color: rgba(0,245,255,0.7);
  }

  .t-line { display: block; }
  .t-prompt { color: var(--neon-purple); margin-right: 10px; }
  .t-cmd { color: var(--neon-cyan); }
  .t-out { color: rgba(255,255,255,0.5); margin-left: 22px; display: block; }
  .t-success { color: #00ff88; margin-left: 22px; display: block; }
  .t-highlight { color: var(--neon-gold); }

  .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--neon-cyan);
    vertical-align: middle;
    margin-left: 3px;
    animation: blink 0.8s step-end infinite;
  }

  /* ── FOOTER ── */
  footer {
    width: 100%;
    max-width: 1100px;
    padding-top: 40px;
    border-top: 1px solid rgba(0,245,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .footer-logo {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
  }

  .footer-copy {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: rgba(0,245,255,0.4); border-radius: 2px; }

  /* ── CORNER DECORATION ── */
  .corner-deco {
    position: fixed;
    width: 80px; height: 80px;
    pointer-events: none;
    z-index: 5;
    opacity: 0.4;
  }

  .corner-deco.tl { top: 20px; left: 20px; border-top: 1px solid var(--neon-cyan); border-left: 1px solid var(--neon-cyan); }
  .corner-deco.tr { top: 20px; right: 20px; border-top: 1px solid var(--neon-cyan); border-right: 1px solid var(--neon-cyan); }
  .corner-deco.bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--neon-cyan); border-left: 1px solid var(--neon-cyan); }
  .corner-deco.br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--neon-cyan); border-right: 1px solid var(--neon-cyan); }

  /* ── PING ANIMATION ── */
  .ping-ring {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    border: 1px solid rgba(0,245,255,0.06);
    border-radius: 50%;
    animation: expand 5s ease-out infinite;
    pointer-events: none;
    z-index: 2;
  }

  .ping-ring:nth-child(2) { animation-delay: 1.7s; }
  .ping-ring:nth-child(3) { animation-delay: 3.4s; }

  @keyframes expand {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.4; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }

  @media (max-width: 680px) {
    .tg-card { padding: 36px 28px; }
    .hero { padding: 60px 0 40px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- THREE.JS CANVAS -->
<canvas id="bg-canvas"></canvas>

<!-- PING RINGS -->
<div class="ping-ring"></div>
<div class="ping-ring"></div>
<div class="ping-ring"></div>

<!-- CORNER DECORATIONS -->
<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<!-- MAIN CONTENT -->
<div class="wrapper">

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-logo">MC PANELS // PROXY NETWORK</div>
    <div class="nav-status">
      <span class="status-dot"></span>
      SYSTEMS ONLINE

<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 50);

  /* ── GRID PLANE ── */
  const gridHelper = new THREE.GridHelper(200, 40, 0x003344, 0x001a22);
  gridHelper.position.y = -20;
  gridHelper.rotation.x = 0.15;
  scene.add(gridHelper);

  /* ── PARTICLE SYSTEM ── */
  const particleCount = 2000;
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);

  const colorOptions = [
    new THREE.Color(0x00f5ff),
    new THREE.Color(0xbf00ff),
    new THREE.Color(0xff006e),
    new THREE.Color(0xffd60a),
  ];

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3]     = (Math.random() - 0.5) * 200;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 120;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 150;
    const c = colorOptions[Math.floor(Math.random() * colorOptions.length)];
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
    sizes[i] = Math.random() * 1.8 + 0.3;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 0.5,
    vertexColors: true,
    transparent: true,
    opacity: 0.65,
    sizeAttenuation: true,
  });

  const particles = new THREE.Points(geo, mat);
  scene.add(particles);

  /* ── WIREFRAME TORUS ── */
  const torusGeo = new THREE.TorusGeometry(18, 6, 16, 60);
  const torusMat = new THREE.MeshBasicMaterial({
    color: 0x00f5ff,
    wireframe: true,
    transparent: true,
    opacity: 0.06,
  });
  const torus = new THREE.Mesh(torusGeo, torusMat);
  torus.rotation.x = 0.4;
  torus.position.set(30, 5, -20);
  scene.add(torus);

  /* ── ICOSAHEDRON ── */
  const icoGeo = new THREE.IcosahedronGeometry(8, 1);
  const icoMat = new THREE.MeshBasicMaterial({
    color: 0xbf00ff,
    wireframe: true,
    transparent: true,
    opacity: 0.08,
  });
  const ico = new THREE.Mesh(icoGeo, icoMat);
  ico.position.set(-28, 4, -15);
  scene.add(ico);

  /* ── OCTAHEDRON ── */
  const octGeo = new THREE.OctahedronGeometry(5, 0);
  const octMat = new THREE.MeshBasicMaterial({
    color: 0x00f5ff,
    wireframe: true,
    transparent: true,
    opacity: 0.12,
  });
  const oct = new THREE.Mesh(octGeo, octMat);
  oct.position.set(0, 10, -10);
  scene.add(oct);

  /* ── MOUSE PARALLAX ── */
  let mx = 0, my = 0;
  document.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── RENDER LOOP ── */
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.005;

    particles.rotation.y = t * 0.05;
    particles.rotation.x = t * 0.02;

    torus.rotation.y = t * 0.3;
    torus.rotation.z = t * 0.1;

    ico.rotation.y = t * 0.4;
    ico.rotation.x = t * 0.2;

    oct.rotation.x = t * 0.6;
    oct.rotation.z = t * 0.4;

    gridHelper.position.z = (t * 3) % 5;

    camera.position.x += (mx * 6 - camera.position.x) * 0.02;
    camera.position.y += (-my * 4 - camera.position.y) * 0.02;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  animate();

  /* ── GSAP COUNTER ANIMATION ── */
  function animateCounters() {
    const stats = [
      { el: document.querySelector('.stats-row .stat-card:nth-child(1) .stat-value'), target: 99.9, suffix: '%', decimals: 1 },
      { el: document.querySelector('.stats-row .stat-card:nth-child(3) .stat-value'), target: 500, suffix: '+', decimals: 0 },
    ];
    stats.forEach(s => {
      if (!s.el) return;
      let val = { v: 0 };
      gsap.to(val, {
        v: s.target,
        duration: 2.5,
        delay: 1.5,
        ease: 'power2.out',
        onUpdate() {
          s.el.textContent = s.decimals > 0 ? val.v.toFixed(s.decimals) + s.suffix : Math.round(val.v) + s.suffix;
        }
      });
    });
  }

  animateCounters();
})();
</script>
